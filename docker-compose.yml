version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: yardd_postgres
    restart: always
    environment:
      POSTGRES_USER: yardd_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: yardd_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
